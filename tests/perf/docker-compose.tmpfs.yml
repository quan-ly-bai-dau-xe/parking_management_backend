# Compose override file for load testing and benchmarking.
# Mounts /app/media to RAM (tmpfs) to prevent media pollution in the host repository
# and maximize I/O performance during load tests.
#
# Usage:
#   docker compose -f docker-compose.yml -f tests/perf/docker-compose.tmpfs.yml up -d

services:
  web:
    volumes: !reset []
    tmpfs:
      - /app/media:rw,size=512m,uid=10001,gid=10001,mode=1777
