name: Django check & test suite

on:
  push:
    branches: [main, master, dev, "feat/**"]
  pull_request:
    branches: [main, master, dev, "feat/**"]

permissions:
  contents: read

jobs:
  django-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: parking_ci_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: parking_ci_test
      POSTGRES_USER: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DEBUG: "False"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14.7
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: "requirements/02-dev.txt"

      - name: Generate runtime secret key
        run: |
          python -c "import secrets; print(f'SECRET_KEY={secrets.token_urlsafe(50)}')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/02-dev.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy Type Checker
        run: mypy .

      - name: Check for Missing Migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply Migrations and Seed Data
        run: |
          python manage.py migrate
          python manage.py load_sample_data --force-production

      - name: Validate OpenAPI Schema
        run: python manage.py spectacular --validate --fail-on-warn

      - name: Run Pytest Suite with Coverage
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=80
